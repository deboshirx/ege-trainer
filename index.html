<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Тренажёр ЕГЭ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#EEF2F8; --card:#FFFFFF; --text:#14161A; --hint:#8A93A3; --line:#E3E8F0;
  --accent:#2F6BFF; --accent-soft:#E6EEFF; --accent-text:#FFFFFF;
  --ok:#22A55B; --ok-soft:#E3F6EA; --bad:#E5484D; --bad-soft:#FDE8E8; --disabled:#B8C0CC;
  --grid:#E6E9EE; --grid2:#C9CED6; --curve:#C8463D;
}
:root.dark{
  --bg:#0F1115; --card:#1B1E24; --text:#F2F4F7; --hint:#8B93A1; --line:#2A2E36;
  --accent:#4C82FF; --accent-soft:#1E2A44; --ok-soft:#14301F; --bad-soft:#3A1A1C; --disabled:#3A404B;
  --grid:#252A32; --grid2:#3A414C; --curve:#FF6B5E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.screen{max-width:560px;margin:0 auto;padding:16px 16px 120px;min-height:100vh}
.hdr{display:flex;align-items:center;gap:12px;min-height:48px;margin-bottom:8px}
.hdr h1{flex:1;min-width:0;margin:0;font-size:18px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:44px;height:44px;border-radius:50%;border:none;background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 2px 8px rgba(20,22,26,.06)}
.spacer{width:44px;flex:0 0 auto}
.hero{background:var(--accent);color:#fff;border-radius:24px;padding:22px 20px;margin-bottom:16px}
.hero .t{font-size:24px;font-weight:800;line-height:1.15}
.hero .s{opacity:.85;margin-top:6px;font-size:15px}
.hero .bar{height:8px;background:rgba(255,255,255,.25);border-radius:99px;margin-top:16px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.hero .meta{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin-top:8px}
.panel{background:var(--card);border-radius:24px;padding:20px 16px}
.panel h2{margin:0 0 14px 4px;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.subj{width:100%;display:flex;align-items:center;gap:14px;border:none;background:var(--bg);border-radius:18px;padding:14px 16px;text-align:left;font-size:17px;margin-bottom:10px}
.subj .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}
.subj .nm{flex:1;min-width:0}
.subj .sm{display:block;font-size:13px;color:var(--hint);margin-top:2px}
.subj .pc{font-size:13px;color:var(--hint);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px -16px 18px;padding:0 16px}
.tab{flex:1;border:none;background:none;padding:12px 4px 14px;font-size:17px;color:var(--hint);position:relative;font-weight:600}
.tab.on{color:var(--text)}
.tab.on::after{content:"";position:absolute;left:12%;right:12%;bottom:-1px;height:4px;border-radius:4px 4px 0 0;background:var(--accent)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 12px}
.sec b{font-size:22px;font-weight:800}
.link{border:none;background:none;color:var(--accent);font-size:16px;font-weight:600;padding:8px 0}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.chip{aspect-ratio:1/1;border:2px solid transparent;border-radius:16px;background:var(--card);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;transition:background .15s,color .15s}
.chip.on{background:var(--accent);color:var(--accent-text)}
.chip .d{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.on .d{background:#fff}
.box{background:var(--card);border-radius:20px;padding:4px 18px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;padding:16px 0;border:none;background:none;width:100%;text-align:left;font-size:16px;line-height:1.35}
.opt + .opt{border-top:1px solid var(--line)}
.opt .lb{flex:1}
.opt .lb small{display:block;color:var(--hint);font-size:13px;margin-top:2px}
.cb{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb svg{display:none}.cb.on svg{display:block}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(0,0,0,0))}
.bottom .in{max-width:528px;margin:0 auto}
.main{width:100%;height:56px;border:none;border-radius:18px;background:var(--accent);color:var(--accent-text);font-size:17px;font-weight:700}
.main:disabled{background:var(--disabled);cursor:default}
.count{font-size:13px;color:var(--hint);text-align:center;margin-bottom:8px;min-height:16px}
.prog{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.prog .bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.prog span{font-size:13px;color:var(--hint);font-weight:600}
.card{background:var(--card);border-radius:22px;padding:18px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:99px;margin-bottom:12px}
.q{font-size:17px;line-height:1.55;white-space:pre-line}
.fmt{margin-top:12px;font-size:13px;color:var(--hint)}
.ansrow{display:flex;gap:10px;margin-top:10px}
.ansrow input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:17px;padding:0 14px;outline:none}
.ansrow input:focus{border-color:var(--accent)}
.ansrow input.ok{border-color:var(--ok)}.ansrow input.bad{border-color:var(--bad)}
.btn2{height:52px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:16px;padding:0 18px}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:600;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.acc{margin-top:12px;background:var(--card);border-radius:20px;overflow:hidden}
.acc > button{width:100%;border:none;background:none;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-size:16px;font-weight:600;text-align:left}
.acc .body{padding:0 18px 18px;font-size:15px;line-height:1.6}
.acc .body ul,.acc .body ol{margin:0;padding-left:20px}
.acc .body li{margin-bottom:6px}
.acc .tip{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.acc .final{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--ok-soft);font-weight:700;white-space:pre-line}
.acc .final.long{font-weight:400;line-height:1.6}
.chev{transition:transform .2s;color:var(--hint)}
.acc.open .chev{transform:rotate(180deg)}
.res{text-align:center;padding:30px 18px}
.res .big{font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.res p{color:var(--hint);margin:10px 0 0;font-size:16px}
.rlist{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;font-size:15px}
.ritem .st{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:0 0 auto}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.bad{background:var(--bad-soft);color:var(--bad)}.st.sk{background:var(--line);color:var(--hint)}
.home-top{margin:22px 4px 12px}
.home-top h2{font-size:22px;font-weight:800;margin:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:none;background:var(--card);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;box-shadow:0 2px 10px rgba(20,22,26,.05)}
.tile:active{transform:scale(.98)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:6px}
.tile .tn{font-size:16px;font-weight:700;line-height:1.25}
.tile .tm{font-size:13px;color:var(--hint)}
.tile .tb{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
.tile .tb i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tile .tp{font-size:12px;color:var(--hint);font-weight:600}
.cur-card{width:100%;margin-top:16px;display:flex;align-items:center;gap:14px;border:none;background:var(--card);border-radius:22px;padding:16px;text-align:left;box-shadow:0 2px 10px rgba(20,22,26,.05)}
.cur-card .ava{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cur-card .info{flex:1;min-width:0;font-size:16px}
.cur-card .info small{display:block;color:var(--hint);font-size:13px;margin-top:3px;line-height:1.35}
.screen.with-tabs{padding-bottom:110px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tb-btn{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;font-size:11px;font-weight:600;color:var(--hint);border-radius:14px}
.tb-btn.on{color:var(--accent);background:var(--accent-soft)}
.page-t{font-size:28px;font-weight:800;margin:20px 4px 6px}
.page-s{font-size:15px;color:var(--hint);margin:0 4px 16px;line-height:1.45}
.opt .lb small{line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--accent)}
.stat span{font-size:12px;color:var(--hint);line-height:1.3;display:block;margin-top:4px}
.prog-box{padding:6px 18px}
.prow{padding:14px 0}
.prow + .prow{border-top:1px solid var(--line)}
.pr-top{display:flex;justify-content:space-between;font-size:16px;font-weight:600}
.pr-top b{color:var(--accent)}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pr-sub{font-size:13px;color:var(--hint)}
.empty-card{color:var(--hint);font-size:15px;line-height:1.5;text-align:center}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;position:relative}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.danger{color:var(--bad)}
.center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-bottom:40px}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lock-ic{width:76px;height:76px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.pick-head{padding:28px 4px 20px}
.pick-head .t{font-size:28px;font-weight:800;line-height:1.15}
.pick-head .s{color:var(--hint);margin-top:8px;font-size:15px;line-height:1.45}
.ic-sm{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 auto}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.panel-top h2{margin:0 0 0 4px}
.cur-btn{margin-top:12px;width:100%;min-height:48px;border:2px solid var(--accent);border-radius:14px;background:none;color:var(--accent);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px}
.sheet-wrap{position:fixed;inset:0;background:rgba(10,12,16,0);display:flex;align-items:flex-end;justify-content:center;z-index:50;transition:background .25s}
.sheet-wrap.show{background:rgba(10,12,16,.45)}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;max-height:85vh;overflow:auto}
.sheet-wrap.show .sheet{transform:none}
.sheet-grip{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet-t{font-size:20px;font-weight:800;margin:0 4px 6px}
.sheet-s{font-size:14px;color:var(--hint);line-height:1.45;margin:0 4px 14px}
.cur{width:100%;display:flex;align-items:center;gap:12px;border:2px solid transparent;background:var(--bg);border-radius:16px;padding:12px 14px;text-align:left;margin-bottom:8px}
.cur.on{border-color:var(--accent)}
.cur .ava{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto}
.cur .info{flex:1;min-width:0;font-size:16px}
.cur .info small{display:block;color:var(--hint);font-size:13px;margin-top:2px;line-height:1.35}
.cur .tag{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:99px;white-space:nowrap}
.sheet-close{width:100%;height:50px;border:none;border-radius:14px;background:var(--bg);font-weight:600;font-size:16px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:#14161A;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);z-index:60;transition:opacity .25s,transform .25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{font-size:16px;white-space:nowrap}
.lbox{background:var(--card);border-radius:20px;padding:0 16px;margin-bottom:4px}
.lrow{width:100%;display:flex;align-items:center;gap:14px;border:none;background:none;padding:16px 0;text-align:left;font-size:17px}
.lrow + .lrow{border-top:1px solid var(--line)}
.lrow .lic{color:var(--text);display:flex}
.lrow .lb{flex:1}.lrow .lb small{display:block;color:var(--hint);font-size:13px;margin-top:2px}
.lrow > svg:last-child{color:var(--text)}
.vlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.var{display:flex;align-items:center;gap:14px;border:none;background:var(--card);border-radius:20px;padding:14px 16px;text-align:left}
.var .vn{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.var .lb{flex:1;min-width:0;font-size:17px}.var .lb small{display:block;color:var(--hint);font-size:13px;margin-top:2px}
.var .pbar{display:block;height:5px;margin:8px 0 0}
.var > svg{color:var(--hint)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{border:none;background:var(--card);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:168px}
.game .gic{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.game b{font-size:16px;line-height:1.25}.game small{font-size:13px;color:var(--hint);line-height:1.35}
.game:disabled{opacity:.55;cursor:default}
.two{display:flex;gap:10px}.two > *{flex:1}
.ghost{height:56px;border:2px solid var(--line);border-radius:18px;background:var(--card);font-size:17px;font-weight:700}
/* тренировка */
.train .hdr{margin-bottom:0}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;background:var(--card);margin:8px -16px 0;padding:12px 16px 16px;border-radius:0 0 26px 26px;scroll-behavior:smooth;position:sticky;top:0;z-index:5}
.strip::-webkit-scrollbar{display:none}
.sn{flex:0 0 auto;min-width:50px;height:50px;padding:0 8px;border:none;border-radius:14px;background:var(--bg);font-size:18px;font-weight:600;color:var(--text)}
.sn.now{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.35)}
.sn.ok{background:var(--ok-soft);color:var(--ok)}.sn.bad{background:var(--bad-soft);color:var(--bad)}
.tcard{margin-top:16px;padding:20px 18px 8px;border-radius:26px}
.kim{font-size:22px;font-weight:800;line-height:1.25}
.kid{color:var(--hint);font-weight:700;margin-left:6px}
.ktopic{font-size:13px;color:var(--hint);margin:6px 0 14px}
.q{white-space:normal;font-size:17px;line-height:1.55}
.q p{margin:0 0 12px}
.olist{margin:4px 0 12px;display:flex;flex-direction:column;gap:6px}
.oi{display:flex;gap:8px}.oi .on{color:var(--hint);flex:0 0 auto;min-width:22px}
.tbl-wrap{overflow-x:auto;margin:10px 0 14px}
.mtbl{width:100%;border-collapse:collapse;font-size:16px;line-height:1.4}
.mtbl th,.mtbl td{border:1.5px solid var(--text);padding:12px 12px;vertical-align:top;text-align:left}
.mtbl th{font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.02em;vertical-align:middle}
.mtbl td:first-child{width:58%}
.fig{margin:8px 0 14px;display:flex;justify-content:center}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.fg-grid{stroke:var(--grid);stroke-width:.7}.fg-grid.b{stroke:var(--grid2);stroke-width:1}
.fg-axis{stroke:var(--text);stroke-width:1.4}.fg-arrow{fill:var(--text)}
.fg-n{fill:var(--hint);font-size:11px;font-family:inherit}.fg-n.big{font-size:14px;fill:var(--text)}
.fg-name,.fg-lbl,.fg-fn{fill:var(--text);font-size:15px;font-style:italic;font-family:"Times New Roman",Georgia,serif}
.fg-fn{fill:var(--curve)}
.fg-title{fill:var(--text);font-size:13px;font-weight:700}
.fg-curve{fill:none;stroke:var(--curve);stroke-width:2.2;stroke-linejoin:round}.fg-curve.alt{stroke:var(--accent)}.dash{stroke-dasharray:5 4}
.fg-seg{stroke:var(--hint);stroke-width:1.2}
.fg-pt{fill:var(--text)}.fg-pt.open{fill:var(--card);stroke:var(--text);stroke-width:1.5}
.fg-bar{fill:var(--accent)}
.fg-geo{fill:none;stroke:var(--text);stroke-width:1.8;stroke-linejoin:round}.fg-geo.thin{stroke-width:1.2}
input.ans{width:100%;height:60px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:18px;padding:0 18px;outline:none;margin-top:16px}
input.ans:focus{border-color:var(--accent)}input.ans.ok{border-color:var(--ok);background:var(--ok-soft)}input.ans.bad{border-color:var(--bad)}
input.ans::placeholder{color:var(--hint)}
.act{width:100%;height:60px;border-radius:18px;margin-top:14px;font-size:18px;font-weight:600;border:1.5px solid var(--line);background:var(--card)}
.act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tools{display:flex;gap:26px;border-top:1.5px solid var(--line);margin-top:22px;padding:14px 4px 8px}
.ti{border:none;background:none;color:var(--hint);padding:6px;display:flex}
.ti.on{color:var(--accent)}.ti.on svg path{fill:currentColor}
.report{display:flex;align-items:center;gap:14px;border:none;background:none;color:var(--hint);text-align:left;font-size:16px;line-height:1.35;padding:16px 12px;width:100%}
.report svg{flex:0 0 auto}
.flash{display:block;width:100%;min-height:380px;border:none;background:none;padding:0;perspective:1200px;position:relative;text-align:left;margin-top:6px}
.flash .face{position:absolute;inset:0;background:var(--card);border-radius:26px;padding:24px 22px;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s;box-shadow:0 4px 18px rgba(20,22,26,.06);overflow:auto}
.flash .front{align-items:center;justify-content:center;text-align:center;gap:10px}
.flash .back{transform:rotateY(180deg);font-size:15px;line-height:1.55}
.flash.flip .front{transform:rotateY(-180deg)}.flash.flip .back{transform:rotateY(0)}
.flash .fn{font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.flash .ft{font-size:19px;font-weight:700;line-height:1.3}
.flash .back .ft{font-size:15px;color:var(--hint);margin-bottom:10px}
.flash .fh{font-size:14px;color:var(--hint);margin-top:10px;max-width:260px}
.flash ul{margin:0;padding-left:20px}.flash li{margin-bottom:6px}
.flash .tip{display:block;margin-top:12px;padding:12px;border-radius:14px;background:var(--accent-soft)}
.ritem{border:none;width:100%}
.katex{font-size:1.08em}
.hidden{display:none}
</style>
